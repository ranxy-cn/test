---
- name: Restart sidecar probe (whitelist ACT-RESTART-PROBE)
  hosts: devops
  gather_facts: false
  vars:
    probe_service: "{{ probe_name | default('biz-probe') }}"
  tasks:
    - name: stop note
      ansible.builtin.debug:
        msg: "restart probe {{ probe_service }} on {{ inventory_hostname }}"
    - name: restart probe service
      ansible.builtin.service:
        name: "{{ probe_service }}"
        state: restarted
      when: (ansible_connection | default('ssh')) != 'local'
    - name: skip live probe restart on local/demo
      ansible.builtin.debug:
        msg: "local connection: skip service restart for {{ probe_service }}"
      when: (ansible_connection | default('ssh')) == 'local'
    - name: health ping
      ansible.builtin.ping:
