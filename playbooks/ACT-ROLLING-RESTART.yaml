id: ACT-ROLLING-RESTART
name: 应用滚动重启
version: "1.0.0"
description: 从负载均衡摘流后重启应用进程，并做健康检查。适用于无状态应用因 Full GC / 内存泄漏导致的 CPU 飙高。
risk: low
auto_allowed: true
requires_db_ok: true
requires_reachable: true
restart_cooldown: true
success_criteria: 业务探测连续 3 次通过，观察期无复发
stop_conditions: 探测失败或复发立即停止，禁止循环重启，携带全量证据升级人工
allowed_params:
  batch_size:
    type: integer
    default: 1
steps:
  - id: drain
    name: 摘除流量
    mock_seconds: 0.2
  - id: restart
    name: 重启进程
    mock_seconds: 0.4
  - id: health
    name: 进程健康检查
    mock_seconds: 0.2
