[alembic]
# 迁移脚本目录（相对 backend/）
script_location = migrations
# 版本文件命名：0001_xxx / 0002_xxx
file_template = %%(rev)s_%%(slug)s
# 数据库连接：默认读环境变量 DATABASE_URL（由 env.py 处理），此处仅占位
sqlalchemy.url =
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
